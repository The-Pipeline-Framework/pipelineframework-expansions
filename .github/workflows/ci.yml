name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Verify distributions
        run: ./mvnw -B -V clean verify -U -Dgpg.skip -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
      - name: Resolve GraphQL distribution
        run: ./mvnw -B -pl graphql dependency:tree -U -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
      - name: Resolve OpenAPI distribution
        run: ./mvnw -B -pl openapi dependency:tree -U -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
